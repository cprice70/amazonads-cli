name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No registry-url here: with it, setup-node writes an .npmrc with a
      # placeholder NODE_AUTH_TOKEN and npm uses that instead of OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          # Surfaces the "oidc" log lines that explain a failed token exchange.
          NPM_CONFIG_LOGLEVEL: verbose
